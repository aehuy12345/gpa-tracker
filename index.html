<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA Tracker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>GPA Tracker</h1>

      <form id="course-form" novalidate>
        <div class="field">
          <label for="name">Tên môn</label>
          <input id="name" name="name" type="text" autocomplete="off" />
          <p class="error" id="name-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="credits">Số tín chỉ</label>
          <input id="credits" name="credits" type="text" inputmode="numeric" autocomplete="off" />
          <p class="error" id="credits-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="score">Điểm hệ 10</label>
          <input id="score" name="score" type="text" inputmode="decimal" autocomplete="off" />
          <p class="error" id="score-error" role="alert"></p>
        </div>
        <button type="submit" id="submit-btn">Thêm môn</button>
      </form>

      <section id="summary" aria-live="polite">
        <h2>Kết quả</h2>
        <dl class="stats">
          <div><dt>GPA hệ 4</dt><dd id="gpa4">—</dd></div>
          <div><dt>GPA hệ 10</dt><dd id="gpa10">—</dd></div>
          <div><dt>Xếp loại</dt><dd id="classification">—</dd></div>
          <div><dt>Tổng số môn</dt><dd id="stat-count">0</dd></div>
          <div><dt>Tổng tín chỉ</dt><dd id="stat-credits">0</dd></div>
          <div><dt>Tín chỉ đạt</dt><dd id="stat-earned">0</dd></div>
        </dl>
      </section>

      <section>
        <h2>Danh sách môn học</h2>
        <p id="empty-hint" class="hint">Hãy thêm môn học đầu tiên</p>
        <div class="table-wrap">
          <table id="course-table" hidden>
            <thead>
              <tr><th>Tên môn</th><th>Tín chỉ</th><th>Điểm hệ 10</th><th>Điểm chữ</th><th>Hệ 4</th></tr>
            </thead>
            <tbody id="course-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
